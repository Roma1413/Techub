name: techhub
description: TechHub - Premium Electronics Shopping App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  http: ^1.2.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4
  uuid: ^4.3.3
  drift: ^2.13.1
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.9.0
  firebase_core: ^3.15.2
  cloud_firestore: 5.6.12
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.13.2
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/stores.json
    - assets/prod/
    - assets/tech/

